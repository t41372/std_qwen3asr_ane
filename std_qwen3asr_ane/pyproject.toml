[project]
name = "std-qwen3asr-ane"
version = "0.1.0a1"
description = "Qwen3-ASR 1.7B on Apple Neural Engine, with Standard ASR integration"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "standard-asr @ git+https://github.com/standard-voice/standard_asr.git@main",
  "coremltools>=9.0",
  "numpy>=2.0",
  "tokenizers>=0.22",
  "soundfile>=0.13",
  "scipy>=1.15",
]

[project.optional-dependencies]
# Exact speculative decoding with a 0.6B draft on the GPU. mlx-audio needs
# transformers 5, which the convert group cannot use; install one or the other.
gpu-draft = ["mlx-audio[stt]==0.5.3"]

[project.entry-points."standard_asr.models"]
"std-qwen3asr-ane/1.7b" = "std_qwen3asr_ane.plugin:Qwen3ASREngine"

[project.scripts]
qwen3-asr-ane = "std_qwen3asr_ane.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]
eval = ["jiwer>=4.0"]
convert = ["torch>=2.7", "safetensors>=0.5", "huggingface-hub>=0.34", "transformers>=4.57,<5", "qwen-asr>=0.0.6", "jiwer>=4.0"]

[tool.uv]
conflicts = [[{ extra = "gpu-draft" }, { group = "convert" }]]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
