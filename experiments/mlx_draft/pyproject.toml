[project]
name = "qwen3-asr-mlx-draft"
version = "0.1.0"
description = "Experimental environment holding both the MLX draft model and the Core ML ANE runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlx-audio[stt]==0.5.3",
  "coremltools>=9.0",
  "std-qwen3asr-ane",
  "jiwer>=4.0",
  "scipy>=1.15",
  "soundfile>=0.13",
]

[tool.uv.sources]
std-qwen3asr-ane = { path = "../../std_qwen3asr_ane", editable = true }

[tool.uv]
package = false
